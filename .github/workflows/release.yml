name: release

# Publishes to npm with provenance via OIDC trusted publishing when a GitHub
# Release is published. No npm token is used — authentication is OIDC, and npm
# generates provenance attestations automatically under trusted publishing.
#
# PREREQUISITE (one-time, on npmjs.com): register this repo+workflow as a
# Trusted Publisher for @saihm/mcp-server-pro — package Settings -> Trusted Publisher:
#   Organization or user : SAIHM-Admin
#   Repository           : saihm-mcp-server-pro
#   Workflow filename    : release.yml
#   Allowed actions      : npm publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # NOTE: deliberately NO registry-url — setup-node's registry-url writes an
      # .npmrc with a placeholder NODE_AUTH_TOKEN that shadows OIDC (npm then never
      # reaches trusted publishing). Omitting it leaves no auth line, so npm engages
      # OIDC on the default registry. access:public comes from package.json.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'            # >= 22.14.0 required for OIDC

      - name: Use npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Verify package + manifest versions match the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          SRVPKG="$(node -p "require('./server.json').packages[0].version")"
          # The LOCKFILE is gated too. It was not, and v0.4.1 shipped a tag whose
          # package-lock.json still said 0.3.0 at both fields - repaired in-tree afterwards, never
          # caught here. `npm version` updates it; a hand-edit of the two JSONs does not.
          LOCK="$(node -p "require('./package-lock.json').version")"
          LOCKPKG="$(node -p "require('./package-lock.json').packages[''].version")"
          echo "package.json=$PKG  server.json=$SRV  server.json.packages[0]=$SRVPKG  package-lock.json=$LOCK/$LOCKPKG  release-tag=$TAG"
          test "$PKG" = "$TAG"    || { echo "::error::package.json version mismatch ($PKG != $TAG)"; exit 1; }
          test "$LOCK" = "$TAG"    || { echo "::error::package-lock.json version mismatch ($LOCK != $TAG)"; exit 1; }
          test "$LOCKPKG" = "$TAG" || { echo "::error::package-lock.json packages[''].version mismatch ($LOCKPKG != $TAG)"; exit 1; }
          test "$SRV" = "$TAG"    || { echo "::error::server.json version mismatch ($SRV != $TAG)"; exit 1; }
          test "$SRVPKG" = "$TAG" || { echo "::error::server.json packages[0].version mismatch ($SRVPKG != $TAG)"; exit 1; }
          # The CHANGELOG is gated too, for the same reason the lockfile is: it SHIPS. This branch
          # added it to `files`, so it is now most of the tarball and the newest section of the npm
          # page. Five version fields could all read 0.5.0 while the newest heading still said
          # `[Unreleased]`, linking a diff against a moving `HEAD` - a published page documenting
          # nothing about the version it ships. Same class as the lockfile: a shipping artifact
          # outside the gate.
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$TAG]' heading"; exit 1; }
          grep -q "^\[$TAG\]:" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '[$TAG]:' link definition"; exit 1; }

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test

      # Fetch mcp-publisher and validate the manifest BEFORE the irreversible npm
      # publish. v0.2.0 learned this the hard way: a schema-invalid server.json (a
      # 144-char description against a 100 limit, and format:file_path instead of
      # filepath) surfaced only after npm had already published, leaving that
      # version live but unlisted. Validating first makes it a clean pre-flight
      # failure with npm untouched.
      - name: Fetch mcp-publisher (pinned by version + sha256)
        run: |
          set -euo pipefail
          PUBLISHER_VERSION=v1.7.9
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          TARBALL=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$TARBALL" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate

      - name: Publish (OIDC trusted publishing — provenance is automatic)
        run: npm publish

      # Runs AFTER npm publish because the registry verifies that the npm package
      # carries our `mcpName`. Auth is GitHub Actions OIDC. If this step fails, the
      # npm version is ALREADY LIVE — do not re-cut the release (npm rejects a
      # duplicate version). Fix server.json on main and dispatch registry-publish.yml.
      - name: Publish server.json to the MCP registry (GitHub OIDC)
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          # The registry refuses to register a version it cannot yet see on npm, and
          # npm's read path lags its own publish. 0.6.1 sat in that gap longer than
          # the old five-try budget and this step failed with the npm version already
          # live — which no re-run of this job can repair, because the npm publish
          # above is not idempotent. The budget is now a deadline rather than an
          # attempt count, so the wait tracks propagation instead of an arbitrary
          # number of tries, and it backs off instead of hammering.
          budget=600
          end=$(( $(date +%s) + budget ))
          delay=10
          until ./mcp-publisher publish; do
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "::error::MCP registry publish still failing after $(( budget / 60 )) minutes."
              echo "::error::The npm version is ALREADY LIVE. Do NOT re-cut the release, and do"
              echo "::error::NOT 'gh run rerun --failed' — that re-runs the whole job including"
              echo "::error::the non-idempotent npm publish, which will refuse the version and"
              echo "::error::skip this step again. Recover with:"
              echo "::error::  gh workflow run registry-publish.yml -f ref=main"
              exit 1
            fi
            echo "registry publish failed (npm may still be propagating); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 )); if [ "$delay" -gt 60 ]; then delay=60; fi
          done
